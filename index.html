<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Taki</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --ink:#f4efff; --muted:#aaa0c8; --violet:#a67cff; --deep:#090611; --panel:rgba(25,16,45,.76); }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; overflow-x:hidden; color:var(--ink); font-family:Manrope,Arial,sans-serif; background:radial-gradient(circle at 16% 12%,#44217c 0,transparent 30%),radial-gradient(circle at 80% 85%,#291154 0,transparent 29%),linear-gradient(135deg,#07050c,#10091e 55%,#08050e); background-size:140% 140%; animation:ambientShift 16s ease-in-out infinite alternate; }
    body:before, body:after { content:""; position:fixed; pointer-events:none; border-radius:50%; filter:blur(70px); opacity:.42; }
    body:before { width:310px;height:310px; background:#8b48e5; left:-90px;bottom:-100px; animation:glowLeft 13s ease-in-out infinite alternate; } body:after { width:250px;height:250px; background:#7052ff; right:-90px;top:-70px; animation:glowRight 17s ease-in-out infinite alternate; }
    @keyframes ambientShift { from { background-position:0% 0%; } to { background-position:100% 100%; } }
    @keyframes glowLeft { from { transform:translate3d(0,0,0) scale(1); opacity:.32; } to { transform:translate3d(90px,-55px,0) scale(1.28); opacity:.56; } }
    @keyframes glowRight { from { transform:translate3d(0,0,0) scale(1); opacity:.28; } to { transform:translate3d(-70px,75px,0) scale(1.26); opacity:.52; } }
    @media (prefers-reduced-motion:reduce){ body,body:before,body:after{animation:none} }
    .shell { width:min(940px,calc(100% - 32px)); min-height:528px; position:relative; padding:1px; border-radius:32px; background:linear-gradient(140deg,rgba(195,163,255,.38),rgba(255,255,255,.03) 40%,rgba(133,68,255,.25)); box-shadow:0 28px 80px rgba(0,0,0,.47),0 0 70px rgba(132,69,255,.16); }
    .card { height:100%; min-height:526px; padding:48px; display:grid; grid-template-columns:1fr 1.15fr; gap:52px; align-items:center; border-radius:31px; background:linear-gradient(130deg,rgba(29,20,51,.92),rgba(14,10,28,.82)); backdrop-filter:blur(22px); }
    .profile { display:flex; flex-direction:column; align-items:flex-start; }
    .avatar { width:132px; height:132px; border:1px solid rgba(240,230,255,.34); border-radius:42px; display:grid; place-items:center; position:relative; overflow:hidden; background:linear-gradient(145deg,#b99bff,#50288e 57%,#211137); box-shadow:0 18px 38px rgba(0,0,0,.3), inset 0 1px rgba(255,255,255,.25); }
    .avatar span { font-size:38px;font-weight:800;letter-spacing:-3px; transform:translateX(-2px); }
    .avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:2}.avatar.has-image span,.avatar.has-image:after{opacity:0}.avatar:after { content:""; width:80px;height:80px; position:absolute; right:-34px;top:-26px; border-radius:50%; background:rgba(255,255,255,.28); filter:blur(4px); transition:opacity .2s; }
    .online { position:absolute;z-index:3; width:18px;height:18px;right:10px;bottom:10px; border-radius:50%; background:#b9ff78;border:3px solid #4d2b83; }
    h1 { font-size:34px;line-height:1.12;letter-spacing:-1.7px;margin:24px 0 8px; }
    .username { margin:0;color:var(--muted);font-size:14px; }
    .right { align-self:stretch;display:flex;flex-direction:column;justify-content:center; }
    .eyebrow { margin:0 0 12px;color:#bf9dff;text-transform:uppercase;letter-spacing:1.8px;font-size:10px;font-weight:800; }
    h2 { max-width:430px;margin:0 0 20px;font-size:24px;letter-spacing:-.9px;line-height:1.3;font-weight:600; }
    .links { display:grid; gap:10px; }
    .link { text-decoration:none;color:var(--ink);display:flex;align-items:center;gap:13px;padding:13px 14px;border:1px solid rgba(220,201,255,.11);background:rgba(255,255,255,.035);border-radius:16px;transition:.25s ease; }
    .link:hover { transform:translateX(5px);border-color:rgba(193,145,255,.46);background:rgba(163,105,255,.12); }
    .icon { display:grid;place-items:center;width:31px;height:31px;border-radius:10px;background:linear-gradient(135deg,#9d6cff,#6137af);font-size:15px;font-weight:800; }
    .link div { flex:1; }.link strong { display:block;font-size:13px;font-weight:700; }.link small { display:block;color:var(--muted);font-size:11px;margin-top:2px; }.arrow { color:#c6a7ff;font-size:19px; }
    .music-toggle { position:absolute;left:48px;bottom:42px;display:inline-flex;align-items:center;gap:10px;border:0;padding:11px 15px;border-radius:14px;background:#a978ff;color:#170e2a;font-family:inherit;font-weight:800;font-size:12px;cursor:pointer;box-shadow:0 11px 26px rgba(129,70,225,.3);transition:.2s; }
    .music-toggle:hover { transform:translateY(-2px);background:#bf9cff; }.note { font-size:17px; }
    .modal-layer { position:absolute;inset:0;display:grid;place-items:center;z-index:3;border-radius:31px;background:rgba(5,3,12,.57);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:.25s ease; }
    .modal-layer.show { opacity:1;pointer-events:auto; }.playlist { width:min(348px,calc(100% - 38px));padding:16px;border:1px solid rgba(217,195,255,.28);border-radius:22px;background:linear-gradient(145deg,rgba(35,23,62,.98),rgba(15,10,29,.98));box-shadow:0 22px 58px rgba(0,0,0,.53),0 0 35px rgba(155,91,255,.16);transform:translateY(12px) scale(.97);transition:.25s ease; }
    .modal-layer.show .playlist { transform:none; }.playlist-head { padding:4px 6px 11px;color:#d7c5ff;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:1px; }.playlist-top{display:flex;justify-content:space-between;align-items:center}.close{width:28px;height:28px;border:0;border-radius:9px;background:rgba(188,151,255,.12);color:#e6d9ff;font-size:20px;line-height:1;cursor:pointer}.close:hover{background:rgba(188,151,255,.24)}.track { width:100%;border:0;padding:11px 7px;display:flex;align-items:center;gap:10px;border-radius:11px;background:transparent;color:inherit;text-align:left;font-family:inherit;cursor:pointer; }.track:hover,.track.playing{background:rgba(164,115,255,.12)}.track:disabled{cursor:default;opacity:.62}.play{width:27px;height:27px;flex:none;border-radius:9px;display:grid;place-items:center;background:rgba(178,135,255,.18);color:#d3baff;font-size:10px}.track.playing .play{background:#af80ff;color:#211039;box-shadow:0 0 16px rgba(174,128,255,.48)}.track b{font-size:12px;display:block}.track span{font-size:10px;color:var(--muted)}.audio-note{margin:4px 7px 1px;color:#a99ac5;font-size:10px}
    @media(max-width:680px){ body{min-height:100dvh;padding:16px 0;place-items:center}.shell{width:calc(100% - 24px);min-height:0}.card{min-height:0;padding:30px 22px 96px;grid-template-columns:1fr;gap:25px}.avatar{width:96px;height:96px;border-radius:29px}h1{font-size:29px;margin:16px 0 5px}.right{justify-content:start}.eyebrow{margin-bottom:9px}h2{font-size:20px;margin-bottom:17px}.links{gap:9px}.link{min-height:58px;padding:11px 12px}.icon{width:32px;height:32px}.music-toggle{left:22px;bottom:26px;min-height:45px;padding:11px 14px}.modal-layer{border-radius:31px}.playlist{width:calc(100% - 32px);padding:15px}.track{min-height:53px;padding:10px 7px}.close{width:38px;height:38px;font-size:25px}.audio-note{font-size:10px} }
    @media(max-width:380px){ body{place-items:start center}.card{padding:25px 18px 89px;gap:20px}.avatar{width:82px;height:82px;border-radius:25px}.avatar span{font-size:31px}h1{font-size:26px}h2{font-size:18px}.music-toggle{left:18px;bottom:22px}.playlist{width:calc(100% - 24px)} }
  </style>
</head>
<body>
  <main class="shell">
    <section class="card">
      <div class="profile">
        <div class="avatar" id="profileAvatar" aria-label="Telegram-аватарка"><img id="avatarImage" alt="" hidden><span id="avatarInitials">ТВ</span><i class="online"></i></div>
        <h1 id="profileName">Taki</h1>
        <p class="username" id="profileUsername">@Takigos</p>
      </div>
      <div class="right">
        <h2 id="profileBio">Здесь появится твой текст «О себе» из профиля Telegram.</h2>
        <nav class="links" aria-label="Социальные сети">
          <a class="link" href="https://www.tiktok.com/@takigos" target="_blank" rel="noopener"><span class="icon">♪</span><div><strong>TikTok</strong><small>@takigos</small></div><span class="arrow">↗</span></a>
          <a class="link" href="https://t.me/Takigos" target="_blank" rel="noopener"><span class="icon">✈</span><div><strong>Telegram</strong><small>написать мне</small></div><span class="arrow">↗</span></a>
          <a class="link" href="#"><span class="icon">◌</span><div><strong>Ещё одна ссылка</strong><small>скоро появится</small></div><span class="arrow">↗</span></a>
        </nav>
      </div>
    </section>
    <button class="music-toggle" id="musicToggle" aria-expanded="false"><span class="note">♫</span> любимые треки</button>
    <div class="modal-layer" id="modalLayer" aria-hidden="true">
      <div class="playlist" id="playlist" role="dialog" aria-modal="true" aria-label="Любимые треки">
        <div class="playlist-top"><div class="playlist-head">сейчас в профиле</div><button class="close" id="closePlaylist" aria-label="Закрыть">×</button></div>
        <div id="trackList"></div>
        <p class="audio-note" id="audioNote">Треки появятся после первой синхронизации Telegram.</p>
        <audio id="audioPlayer" preload="metadata"></audio>
      </div>
    </div>
  </main>
  <script>
    const button=document.getElementById('musicToggle'), layer=document.getElementById('modalLayer'), close=document.getElementById('closePlaylist'), audioPlayer=document.getElementById('audioPlayer'), trackList=document.getElementById('trackList'), audioNote=document.getElementById('audioNote');
    let activeTrack;
    const stopTrack=()=>{audioPlayer.pause();audioPlayer.removeAttribute('src');audioPlayer.load();document.querySelectorAll('.track').forEach(track=>{track.classList.remove('playing');track.querySelector('.play').textContent='▶'});activeTrack=null;};
    const playTrack=async(track)=>{if(!track.dataset.src)return;if(activeTrack===track){stopTrack();return;}stopTrack();audioPlayer.src=track.dataset.src;try{await audioPlayer.play();activeTrack=track;track.classList.add('playing');track.querySelector('.play').textContent='Ⅱ'}catch{audioNote.textContent='Не удалось начать воспроизведение. Попробуй ещё раз.'}};
    const formatDuration=(seconds)=>{if(!seconds)return '';const minutes=Math.floor(seconds/60),rest=String(seconds%60).padStart(2,'0');return `${minutes}:${rest}`};
    const renderTracks=(tracks)=>{trackList.replaceChildren();if(!tracks.length){audioNote.textContent='В Telegram пока нет опубликованных треков.';return}tracks.forEach(track=>{const item=document.createElement('button');item.type='button';item.className='track';item.dataset.src=track.src||'';item.disabled=!track.src;item.setAttribute('aria-label',`${track.src?'Воспроизвести':'Недоступен'} ${track.title}`);item.innerHTML=`<i class="play">▶</i><div><b>${track.title}</b><span>${track.artist||'Telegram'}${track.duration?` · ${formatDuration(track.duration)}`:''}</span></div>`;item.addEventListener('click',()=>playTrack(item));trackList.append(item)});audioNote.textContent=tracks.every(track=>track.src)?'Треки из Telegram':'Часть треков больше 20 МБ и доступна только в Telegram.'};
    const setModal=(open)=>{layer.classList.toggle('show',open);button.setAttribute('aria-expanded',open);layer.setAttribute('aria-hidden',!open);if(open)close.focus()};
    button.addEventListener('click',()=>setModal(true)); close.addEventListener('click',()=>{stopTrack();setModal(false)});
    layer.addEventListener('click',(event)=>{if(event.target===layer){stopTrack();setModal(false)}});
    document.addEventListener('keydown',(event)=>{if(event.key==='Escape'){stopTrack();setModal(false)}});
    audioPlayer.addEventListener('ended',stopTrack);
    fetch('./data/telegram-profile.json',{cache:'no-store'}).then(response=>response.ok?response.json():Promise.reject()).then(profile=>{const name=profile.name||'Taki',username=profile.username||'@Takigos';document.getElementById('profileName').textContent=name;document.getElementById('profileUsername').textContent=username;document.getElementById('profileBio').textContent=profile.bio||'Здесь появится твой текст «О себе» из профиля Telegram.';document.getElementById('avatarInitials').textContent=name.slice(0,2).toUpperCase();if(profile.avatar){const avatar=document.getElementById('profileAvatar'),image=document.getElementById('avatarImage');image.src=profile.avatar;image.hidden=false;avatar.classList.add('has-image')}renderTracks(profile.tracks||[])}).catch(()=>renderTracks([]));
  </script>
</body>
</html>
